<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= title %></title>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <div>
      <h1>Fast Scan</h1>
      <form id="pdfForm">
        <!-- <input type="text" name="pdfName" placeholder="Enter PDF Name" required /> -->
        <div class="button-group">
          <select name="dpi" required>
            <option value="100">100 dpi</option>
            <option value="150">150 dpi</option>
            <option value="200" selected>200 dpi</option>
            <option value="300">300 dpi</option>
            <option value="400">400 dpi</option>
          </select>
          <label for="isOnlyOnePage"
            >Is Only One Page?
            <input type="checkbox" name="isOnlyOnePage" id="isOnlyOnePage"
          /></label>
        </div>
        <div class="button-group">
          <button type="button" id="addBlackWhitePage">+ BlackWhite</button>
          <button type="button" id="addGrayScalePage">+ GrayScale</button>
          <button type="button" id="addColorPage">+ Color</button>
        </div>
        <div class="button-group">
          <button type="button" id="removeLastPage">- Remove Last Page</button>
          <button type="button" id="clearAllPages">Clear All Pages</button>
          <button type="button" id="savePdfButton">Save PDF</button>
        </div>
      </form>
      <footer>
        Powered by
        <a href="https://github.com/Shamshod-Nematullayev/fast-scan"
          >Shamshod Ne'matullayev</a
        >
      </footer>
    </div>
    <div id="preview">
      <h3>Pages Preview</h3>
      <div id="pageList"></div>
    </div>
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Processing...</p>
    </div>
    <dialog id="confirmModal">
      <div class="modal-content">
        <div class="modal-header">
          <span class="warning-icon">⚠️</span>
          <h2>Diqqat!</h2>
        </div>
        <div class="modal-body">
          <p>Oxirgi scan qilinganiga 1 soatdan ko'proq vaqt o'tdi.</p>
          <p>Iltimos:</p>
          <ul>
            <li>Hujjatga pechat qo'yilganligini tekshiring.</li>
            <li>Scaner ichida eski hujjatlar qolmaganligiga ishonch hosil qiling.</li>
          </ul>
        </div>
        <div class="modal-footer">
          <button type="button" id="confirmScanBtn">Tekshirdim</button>
          <button type="button" id="cancelScanBtn">Bekor qilish</button>
        </div>
      </div>
    </dialog>

    <div id="toast-container"></div>

    <script src="/script.js"></script>
  </body>
</html>
